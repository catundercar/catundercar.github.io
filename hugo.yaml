baseURL: https://catundercar.github.io/
languageCode: zh-cn
title: travel
theme: PaperMod

paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /:year/:month/:day/:title/

markup:
  highlight:
    style: github
    lineNos: false
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  author: 车底下的猫
  description: "工作、学习中的一些记录"
  keywords: [blog]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false
  ShowToc: true
  TocOpen: false
  DateFormat: "2006-01-02"

  homeInfoParams:
    Title: "道阻且长，行则将至"
    Content: "工作、学习中的一些记录"

  socialIcons:
    - name: github
      url: "https://github.com/catundercar"
    - name: email
      url: "mailto:mrliuxiansen8023@gmail.com"
    - name: rss
      url: "index.xml"

  # Giscus comments
  giscus:
    repo: catundercar/blog-comments
    repoID: R_kgDOIbseyw
    category: General
    categoryID: DIC_kwDOIbsey84CSjRM
    mapping: title
    strict: 1
    reactionsEnabled: 1
    emitMetadata: 0
    inputPosition: top
    theme: light
    lang: zh-CN
    loading: lazy

  assets:
    favicon: /favicon.ico

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 2
    - identifier: wiki
      name: 维基
      url: /wiki/
      weight: 3
    - identifier: about
      name: 关于
      url: /about/
      weight: 4
    - identifier: search
      name: 搜索
      url: /search/
      weight: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags
