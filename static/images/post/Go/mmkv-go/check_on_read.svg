<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>check-on-read 读取流程</title>
  <desc>每次 Get 先比对 .crc 三元组，无变化时走无锁快照查表，有变化时取共享 flock 重新加载并切换快照。</desc>
  <style>
    text{font-family:"Anthropic Sans",-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif;}
    .ttl{fill:#1d1c1a;font-size:15px;font-weight:600;}
    .b{fill:#1d1c1a;font-size:12px;}
    .bf{fill:#1d1c1a;font-size:12px;font-weight:600;}
    .m{fill:#6b6960;font-size:11px;}
    .r{fill:#0F6E56;} .w{fill:#185FA5;} .d{fill:#9a6b1f;}
    .card{fill:#faf9f5;stroke:#cfcdc4;stroke-width:0.5;}
    .rcard{fill:#e7f3ee;stroke:#0F6E56;stroke-width:0.5;}
    .wcard{fill:#eaf2fb;stroke:#185FA5;stroke-width:0.5;}
    .dia{fill:#f6efe1;stroke:#9a6b1f;stroke-width:0.5;}
    .ln{stroke:#6b6960;stroke-width:1.4;fill:none;}
    @media (prefers-color-scheme: dark){
      .ttl{fill:#faf9f5;} .b{fill:#faf9f5;} .bf{fill:#faf9f5;} .m{fill:#a7a59c;}
      .r{fill:#5cc79f;} .w{fill:#7db4e6;} .d{fill:#e0b461;}
      .card{fill:#2a2825;stroke:#3a3833;}
      .rcard{fill:#123a2c;stroke:#5cc79f;}
      .wcard{fill:#16314a;stroke:#7db4e6;}
      .dia{fill:#33291a;stroke:#e0b461;}
      .ln{stroke:#a7a59c;}
    }
  </style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" class="ttl">check-on-read：每次 Get 的变更探针</text>

  <rect x="120" y="56" width="160" height="38" rx="19" class="card"/>
  <text x="200" y="80" text-anchor="middle" class="bf">Get(key)</text>

  <path d="M200 94 V114" class="ln" marker-end="url(#ar2)"/>

  <rect x="92" y="118" width="216" height="56" rx="9" class="card"/>
  <text x="200" y="142" text-anchor="middle" class="bf">读 .crc 三元组（无锁内存读）</text>
  <text x="200" y="162" text-anchor="middle" class="m">crcDigest / actualSize / sequence</text>

  <path d="M200 174 V194" class="ln" marker-end="url(#ar2)"/>

  <polygon points="200,196 286,244 200,292 114,244" class="dia"/>
  <text x="200" y="240" text-anchor="middle" class="bf d">vs 上次快照</text>
  <text x="200" y="258" text-anchor="middle" class="b d">有变化?</text>

  <path d="M200 292 V330" class="ln" marker-end="url(#ar2)"/>
  <text x="214" y="314" class="m">否（≈ +1 ns）</text>
  <rect x="92" y="330" width="216" height="50" rx="9" class="rcard"/>
  <text x="200" y="352" text-anchor="middle" class="bf r">无锁 map lookup</text>
  <text x="200" y="370" text-anchor="middle" class="m">当前 snapshot</text>
  <path d="M200 380 V410" class="ln" marker-end="url(#ar2)"/>
  <rect x="128" y="410" width="144" height="40" rx="9" class="card"/>
  <text x="200" y="435" text-anchor="middle" class="bf">返回值</text>

  <path d="M286 244 H372" class="ln" marker-end="url(#ar2)"/>
  <text x="329" y="234" text-anchor="middle" class="m">是（已更新）</text>
  <rect x="372" y="118" width="252" height="50" rx="9" class="wcard"/>
  <text x="388" y="140" class="bf w">① 取 shared flock</text>
  <text x="388" y="158" class="m">保证一致快照，挡住撕裂读</text>
  <rect x="372" y="184" width="252" height="44" rx="9" class="wcard"/>
  <text x="388" y="211" class="bf w">② 重新 parse 整文件</text>
  <rect x="372" y="244" width="252" height="44" rx="9" class="wcard"/>
  <text x="388" y="271" class="bf w">③ 原子切换 snapshot</text>
  <path d="M498 168 V184" class="ln" marker-end="url(#ar2)"/>
  <path d="M498 228 V244" class="ln" marker-end="url(#ar2)"/>
  <path d="M498 288 V355 H308" class="ln" marker-end="url(#ar2)"/>

  <text x="340" y="462" text-anchor="middle" class="m">探针是无锁内存读（约 +1 ns/读）；仅当三元组变化时才取 flock 重载——对齐 MMKV C++ 行为。</text>
</svg>
